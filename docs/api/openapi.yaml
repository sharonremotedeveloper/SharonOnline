      - password
      - password_confirm
      - username
    RegisterRoleEnum:
      enum:
      - student
      - teacher
      type: string
      description: |-
        * `student` - student
        * `teacher` - teacher
    Reservation:
      type: object
      properties:
        booking_id:
          type: string
          format: uuid
        status:
          type: string
        teacher_id:
          type: string
          format: uuid
        start_time_utc:
          type: string
          format: date-time
        end_time_utc:
          type: string
          format: date-time
        lock_ttl_seconds:
          type: integer
        lock_expires_at:
          type: string
          format: date-time
        message:
          type: string
      required:
      - booking_id
      - end_time_utc
      - lock_expires_at
      - lock_ttl_seconds
      - message
      - start_time_utc
      - status
      - teacher_id
