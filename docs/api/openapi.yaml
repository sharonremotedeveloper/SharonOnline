      type: object
      description: A student's review. `review` is the legacy name of `private_notes`
        (older clients).
      properties:
        rating:
          type: integer
          maximum: 5
          minimum: 1
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagsEnum'
          maxItems: 8
        private_notes:
          type: string
          default: ''
          maxLength: 2000
        review:
          type: string
          writeOnly: true
          default: ''
          maxLength: 2000
      required:
      - rating
