        cefr_display:
          type: string
          readOnly: true
        description:
          type: string
        pdf_file_url:
          type: string
          readOnly: true
        audio_snippet_url:
          type: string
          readOnly: true
        content_html:
          type: string
          description: 'Structured HTML content: article text, vocab definitions,
            discussion questions'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - audio_snippet_url
      - category
      - category_display
      - cefr_display
      - cefr_level
      - created_at
      - id
      - pdf_file_url
      - slug
      - title
      - updated_at
    MaterialList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        category:
          $ref: '#/components/schemas/CategoryEnum'
        category_display:
          type: string
          readOnly: true
        cefr_level:
          $ref: '#/components/schemas/CefrLevelEnum'
        cefr_display:
          type: string
          readOnly: true
        description:
          type: string
        pdf_file_url:
          type: string
          readOnly: true
        audio_snippet_url:
          type: string
          readOnly: true
      required:
      - audio_snippet_url
      - category
