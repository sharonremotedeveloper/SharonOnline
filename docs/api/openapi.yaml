openapi: 3.0.3
info:
  title: Sharon Online API
  version: 1.0.0
  description: 25-minute 1-on-1 ESL marketplace API.
paths:
  /api/v1/admin/attendance/live/:
    get:
      operationId: v1_admin_attendance_live_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/disputes/:
    get:
      operationId: v1_admin_disputes_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/disputes/{id}/resolve/:
    post:
      operationId: v1_admin_disputes_resolve_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/finance/ledger/:
    get:
      operationId: v1_admin_finance_ledger_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/payouts/batch/:
    get:
      operationId: v1_admin_payouts_batch_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/payouts/execute-batch/:
    post:
      operationId: v1_admin_payouts_execute_batch_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/teachers/{id}/verify/:
    patch:
      operationId: v1_admin_teachers_verify_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/teachers/pending-vetting/:
    get:
      operationId: v1_admin_teachers_pending_vetting_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/telemetry/:
    get:
      operationId: v1_admin_telemetry_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: |-
        Blacklists the supplied refresh token so it can no longer mint access tokens.

        Deliberately not gated on a live access token: the refresh token is itself the proof of ownership, and an
        expired access token must not leave a 14-day refresh token impossible to revoke.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      security:
      - {}
      responses:
        '205':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: v1_auth_me_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: v1_auth_me_partial_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/password-change/:
    post:
      operationId: v1_auth_password_change_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      description: |-
        Always answers 202 with the same body, whether or not the address belongs to an account (no enumeration).
        The e-mail is sent by a Celery task after commit, so response time does not reveal it either.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: v1_auth_verify_email_create
      description: (Re)send the verification e-mail for the signed-in user's current
        address.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/verify-email/confirm/:
    post:
      operationId: v1_auth_verify_email_confirm_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/bookings/:
    get:
      operationId: v1_bookings_list
      summary: 'My lessons (students: lessons I booked; tutors: my roster)'
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Lessons starting on/after this UTC date (YYYY-MM-DD) or ISO date-time.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -start_time_utc
          - start_time_utc
        description: 'Default: soonest first for when=upcoming, newest first otherwise.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
        description: 1-100 (default 20).
      - in: query
        name: status
        schema:
          type: string
        description: One or more booking statuses, comma-separated or repeated.
      - in: query
        name: to
        schema:
          type: string
        description: Lessons starting on/before this UTC date (whole day) or ISO date-time.
      - in: query
        name: when
        schema:
          type: string
          enum:
          - past
          - upcoming
        description: upcoming = not yet ended, excluding cancelled and lapsed unpaid
          holds; past = already ended.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingDetailList'
          description: ''
    post:
      operationId: v1_bookings_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreate'
          description: ''
  /api/v1/bookings/{booking_id}/memo/:
    post:
      operationId: v1_bookings_memo_create
      description: |-
        The lesson's own tutor submits (or later corrects) the post-lesson memo. Everything below succeeds or fails together:
        the validated memo, the booking's move to COMPLETED, and the student's flashcards.
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonMemoInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LessonMemoInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LessonMemoInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonMemo'
          description: ''
  /api/v1/bookings/{booking_id}/report-outage/:
    post:
      operationId: v1_bookings_report_outage_create
      description: |-
        Handles Eskom load shedding / grid power interruption during or before a lesson:
        1. Marks booking as INTERRUPTED_POWER.
        2. Refunds 1 lesson credit to student's wallet (or increments active CreditBundle).
        3. Waives any cancellation penalty for the teacher.
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/bookings/{booking_id}/review/:
    post:
      operationId: v1_bookings_review_create
      description: Old URL (POST /bookings/<id>/review/), kept for existing clients;
        identical behaviour.
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewInputRequest'
        required: true
      security:
      - jwtAuth: []
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResult'
          description: ''
  /api/v1/bookings/{id}/:
    get:
      operationId: v1_bookings_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/bookings/reserve/:
    post:
      operationId: v1_bookings_reserve_create
      description: |-
        Validates a slot, takes the 10-minute Redis hold and creates the PENDING_PAYMENT booking in one step.
        The returned `booking_id` is what checkout pays for. Retrying the same request returns the existing live hold.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReserveRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReserveRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
  /api/v1/bookings/slots/{teacher_id}/:
    get:
      operationId: v1_bookings_slots_retrieve
      description: Returns concrete 25-minute slots for a given teacher projected
        into the requested timezone.
      parameters:
      - in: path
        name: teacher_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/integrations/r2/presigned-url/:
    post:
      operationId: v1_integrations_r2_presigned_url_create
      description: |-
        POST /api/v1/integrations/storage/presigned-url/
        POST /api/v1/integrations/r2/presigned-url/
        Generates presigned upload or download URLs for Cloudflare R2 object storage with zero egress fees.
        Direct-to-storage client upload architecture eliminates backend Gunicorn/Celery worker blocking.
        Enforces strict role-based access control (RBAC), Tier 1 vs Tier 2 separation, and path traversal protection.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/integrations/storage/presigned-url/:
    post:
      operationId: v1_integrations_storage_presigned_url_create
      description: |-
        POST /api/v1/integrations/storage/presigned-url/
        POST /api/v1/integrations/r2/presigned-url/
        Generates presigned upload or download URLs for Cloudflare R2 object storage with zero egress fees.
        Direct-to-storage client upload architecture eliminates backend Gunicorn/Celery worker blocking.
        Enforces strict role-based access control (RBAC), Tier 1 vs Tier 2 separation, and path traversal protection.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/materials/:
    get:
      operationId: v1_materials_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMaterialListList'
          description: ''
  /api/v1/materials/{slug}/:
    get:
      operationId: v1_materials_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDetail'
          description: ''
  /api/v1/payments/checkout/init/:
    post:
      operationId: v1_payments_checkout_init_create
      description: |-
        Initializes checkout for PayFast (ZAR) or PayPal (USD). Persists an INITIALIZED transaction holding the
        server-computed expected amount; webhooks are verified against it, never against client/gateway-supplied totals.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/payments/credits/:
    get:
      operationId: v1_payments_credits_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
          description: ''
  /api/v1/student/bookings/{id}/review/:
    post:
      operationId: v1_student_bookings_review_create
      description: |-
        A student rates a lesson that took place: 1-5 stars, optional rubric tags and private notes. One review per lesson;
        the written text is private to staff. Canonical URL: POST /student/bookings/<id>/review/.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResult'
          description: ''
  /api/v1/student/flashcards/:
