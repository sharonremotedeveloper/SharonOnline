components:
  schemas:
    AccentEnum:
      enum:
      - ZA
      - UK
      - US
      - OTHER
      type: string
      description: |-
        * `ZA` - South African
        * `UK` - British
        * `US` - American
        * `OTHER` - International
    AccountTypeEnum:
      enum:
      - cheque
      - savings
      type: string
      description: |-
        * `cheque` - cheque
        * `savings` - savings
    AdminRefund:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        booking_id:
          type: string
          format: uuid
          readOnly: true
        student:
          type: string
          readOnly: true
          description: Display name only (never an e-mail address).
        amount:
          type: string
          readOnly: true
          description: Exact decimal string in `currency`.
        currency:
          type: string
          readOnly: true
        reason:
          allOf:
          - $ref: '#/components/schemas/RefundReasonEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/RefundStatusEnum'
          readOnly: true
        failure_kind:
          allOf:
          - $ref: '#/components/schemas/FailureKindEnum'
          readOnly: true
        failure_detail:
          type: string
          readOnly: true
          description: Stripped and truncated to 200 characters.
        attempts:
          type: integer
          readOnly: true
        next_attempt_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_http_status:
          type: integer
          readOnly: true
          nullable: true
        last_error_code:
          type: string
          readOnly: true
        gateway:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        age_hours:
          type: number
          format: double
          readOnly: true
        recent_attempts:
          type: array
          items:
            $ref: '#/components/schemas/AdminRefundAttempt'
          readOnly: true
      required:
      - age_hours
      - amount
      - attempts
      - booking_id
      - created_at
      - currency
      - failure_detail
      - failure_kind
      - gateway
      - id
      - last_error_code
      - last_http_status
      - next_attempt_at
      - reason
      - recent_attempts
      - status
      - student
    AdminRefundAttempt:
      type: object
      properties:
        seq:
          type: integer
        kind:
          type: string
        result_state:
          type: string
        http_status:
          type: integer
          nullable: true
        error_code:
          type: string
        created_at:
          type: string
          format: date-time
        actor:
          type: string
          nullable: true
          description: Username of the admin, or null for the system.
