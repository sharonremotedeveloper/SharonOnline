      - dispute
      type: string
      description: |-
        * `student_cancel` - Student cancelled in time
        * `teacher_cancel` - Tutor cancelled
        * `teacher_no_show` - Tutor did not attend
        * `outage` - Power outage interrupted the lesson
        * `dispute` - Dispute decided for the student
