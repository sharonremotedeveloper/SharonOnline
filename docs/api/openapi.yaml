components:
  schemas:
    AccentEnum:
      enum:
      - ZA
      - UK
      - US
      - OTHER
      type: string
      description: |-
        * `ZA` - South African
        * `UK` - British
        * `US` - American
        * `OTHER` - International
    BookingCreate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        start_time_utc:
          type: string
          format: date-time
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
      required:
      - id
      - start_time_utc
      - status
    BookingCreateRequest:
      type: object
      properties:
        teacher_id:
          type: string
          format: uuid
          writeOnly: true
        material_id:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
        start_time_utc:
          type: string
          format: date-time
      required:
      - start_time_utc
      - teacher_id
    BookingDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        booking_reference:
          type: string
          readOnly: true
        teacher:
          allOf:
          - $ref: '#/components/schemas/TeacherList'
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/BookingStudent'
          readOnly: true
        material:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        material_slug:
          type: string
          nullable: true
          readOnly: true
        material_title:
          type: string
          nullable: true
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
          default: pending_payment
        start_time_utc:
          type: string
          format: date-time
          readOnly: true
        end_time_utc:
          type: string
          format: date-time
          readOnly: true
        local_date:
          type: string
          readOnly: true
        local_start_time:
          type: string
          readOnly: true
        local_end_time:
          type: string
          readOnly: true
        viewer_timezone:
          type: string
          readOnly: true
        price_usd:
          type: number
          format: double
          readOnly: true
        price_zar:
          type: number
          format: double
          readOnly: true
        lock_expires_at:
          type: string
          nullable: true
          readOnly: true
        zoom_url:
          type: string
          readOnly: true
        zoom_join_url:
          type: string
          readOnly: true
        zoom_start_url:
          type: string
          readOnly: true
        zoom_meeting_id:
          type: string
          readOnly: true
        zoom_password:
          type: string
          readOnly: true
        student_rating:
          type: integer
          readOnly: true
          nullable: true
          description: 1 to 5 star rating
        student_review:
          type: string
          readOnly: true
          description: 'PRIVATE written review: staff only. Never shown to the tutor
            or other students.'
        memo:
          allOf:
          - $ref: '#/components/schemas/LessonMemo'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - booking_reference
      - created_at
      - end_time_utc
      - id
      - local_date
      - local_end_time
      - local_start_time
      - lock_expires_at
      - material
      - material_slug
      - material_title
      - memo
      - price_usd
      - price_zar
      - start_time_utc
      - status
      - student
      - student_rating
      - student_review
      - teacher
      - viewer_timezone
      - zoom_join_url
      - zoom_meeting_id
      - zoom_password
      - zoom_start_url
      - zoom_url
    BookingStudent:
      type: object
      description: Minimal student view embedded in a booking. Contact details are
        only for the student themselves/staff.
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
          readOnly: true
        first_name:
          type: string
        timezone:
          type: string
        country:
          type: string
      required:
      - country
      - first_name
      - full_name
      - id
      - timezone
    CategoryEnum:
      enum:
      - daily_news
      - freetalk
      - business
      - test_prep
      type: string
      description: |-
        * `daily_news` - Daily News & Discussion
        * `freetalk` - FreeTalk Conversation Prompts
        * `business` - Business English & Professional
        * `test_prep` - Job Interview & Test Prep
    CefrLevelEnum:
      enum:
      - A1
      - A2
      - B1
      - B2
      - C1
      - C2
      type: string
      description: |-
        * `A1` - Beginner A1
        * `A2` - Elementary A2
        * `B1` - Intermediate B1
        * `B2` - Upper-Intermediate B2
        * `C1` - Advanced C1
        * `C2` - Proficient C2
    CreditBundleRow:
      type: object
      properties:
        pack_name:
          type: string
        remaining:
          type: integer
        total:
          type: integer
        purchased_at:
          type: string
          format: date-time
      required:
      - pack_name
      - purchased_at
      - remaining
      - total
    CreditLedgerEntry:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
        credits_delta:
          type: integer
        date:
          type: string
          format: date
        type:
          $ref: '#/components/schemas/TypeEnum'
      required:
      - credits_delta
      - date
      - description
      - id
      - type
    CustomTokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    EmailVerifyConfirmRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
      required:
      - token
    LessonMemo:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        booking:
          type: string
          format: uuid
          readOnly: true
        teacher:
          type: string
          format: uuid
          readOnly: true
        student:
          type: string
          format: uuid
          readOnly: true
        feedback_text:
          type: string
          description: Grammar corrections, speaking feedback, overall commentary
        vocabulary_words:
          description: 'List of words: [{''word'': ''resilience'', ''definition'':
            ''...''}]'
        pronunciation_notes:
          type: string
        grammar_notes:
          type: string
          description: Grammar points to remember (shown to the student next to the
            vocabulary)
        homework:
          type: string
        submitted_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - booking
      - feedback_text
      - id
      - student
      - submitted_at
      - teacher
    LessonMemoInputRequest:
      type: object
      description: |-
        What a tutor may submit after a lesson. Unknown keys (e.g. the UI's `booking_id`, `next_steps`) are ignored.
        (DRF's CharField already rejects NUL characters - PostgreSQL cannot store them; the vocabulary items are checked by hand.)
      properties:
        feedback_text:
          type: string
          minLength: 1
          maxLength: 5000
        vocabulary_words:
          type: array
          items: {}
          maxItems: 30
        pronunciation_notes:
          type: string
          default: ''
          maxLength: 5000
        grammar_notes:
          type: string
          default: ''
          maxLength: 5000
        homework:
          type: string
          default: ''
          maxLength: 5000
      required:
      - feedback_text
    LogoutRequestRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    MaterialDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        category:
          $ref: '#/components/schemas/CategoryEnum'
        category_display:
          type: string
          readOnly: true
        cefr_level:
