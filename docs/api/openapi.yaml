      type: object
      properties:
        success:
          type: boolean
        status:
          type: string
        message:
          type: string
      required:
      - message
      - status
      - success
    StatusEnum:
      enum:
      - pending_payment
      - confirmed
      - in_progress
      - completed
      - cancelled
      - disputed
      - interrupted_power
      - student_no_show
      - teacher_no_show
      - completed_pending_memo
      - completed_memo_forfeited
      type: string
      description: |-
        * `pending_payment` - Pending Payment
        * `confirmed` - Confirmed
        * `in_progress` - In Progress
        * `completed` - Completed
        * `cancelled` - Cancelled
        * `disputed` - Disputed
        * `interrupted_power` - Interrupted (Power Outage)
        * `student_no_show` - Student No Show
        * `teacher_no_show` - Teacher No Show
        * `completed_pending_memo` - Completed (Pending Memo)
        * `completed_memo_forfeited` - Completed (Memo Forfeited)
    TagsEnum:
      enum:
