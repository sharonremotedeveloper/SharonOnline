      - username
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        password_confirm:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RegisterRoleEnum'
          default: student
        country:
          type: string
          description: ISO 3166-1 alpha-2 code (e.g. ZA, JP, KR, DE)
          maxLength: 2
        timezone:
          type: string
          minLength: 1
          description: IANA Timezone, e.g. Asia/Tokyo
          maxLength: 64
      required:
