openapi: 3.0.3
info:
  title: Sharon Online API
  version: 1.0.0
  description: 25-minute 1-on-1 ESL marketplace API.
paths:
  /api/v1/admin/attendance/live/:
    get:
      operationId: v1_admin_attendance_live_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/disputes/:
    get:
      operationId: v1_admin_disputes_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/disputes/{id}/resolve/:
    post:
      operationId: v1_admin_disputes_resolve_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/finance/ledger/:
    get:
      operationId: v1_admin_finance_ledger_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/fx-rates/:
    get:
      operationId: v1_admin_fx_rates_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: v1_admin_fx_rates_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/payouts/batch/:
    get:
      operationId: v1_admin_payouts_batch_list
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayoutBatchItem'
          description: ''
  /api/v1/admin/payouts/execute-batch/:
    post:
      operationId: v1_admin_payouts_execute_batch_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/refunds/:
    get:
      operationId: v1_admin_refunds_retrieve
      parameters:
      - in: query
        name: failure_kind
        schema:
          type: string
        description: rejected | already_refunded | guard | exhausted | replay_window
          | provider_failed
      - in: query
        name: gateway
        schema:
          type: string
        description: paypal | payfast
      - in: query
        name: in_flight
        schema:
          type: boolean
        description: 'true: only rows a worker holds a live lease on; false: only
          rows without one.'
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: A RefundRequest status.
      - in: query
        name: waiting_manual
        schema:
          type: boolean
        description: 'true: pending rows whose last gateway answer was ''manual''.'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRefundPage'
          description: ''
  /api/v1/admin/refunds/{refund_id}/retry/:
    post:
      operationId: v1_admin_refunds_retry_create
      description: '409 codes: `not_failed` (only a failed refund can be retried),
        `confirmation_required` (ambiguous failure: send `confirm_not_refunded_in_gateway:
        true` after checking the gateway), `guard_failed` (a safety check still refuses
        it).'
      parameters:
      - in: path
        name: refund_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRefundRetryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminRefundRetryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminRefundRetryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRefund'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRefundError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRefundError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRefundError'
          description: ''
  /api/v1/admin/teachers/{id}/verify/:
    patch:
      operationId: v1_admin_teachers_verify_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/teachers/pending-vetting/:
    get:
      operationId: v1_admin_teachers_pending_vetting_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/telemetry/:
    get:
      operationId: v1_admin_telemetry_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/inquiries/:
    post:
      operationId: v1_auth_inquiries_create
      description: Persist the request before queueing its notification, so provider
        failure cannot lose it.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportInquiryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupportInquiryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupportInquiryRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportInquiryAccepted'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: |-
        Blacklists the supplied refresh token so it can no longer mint access tokens.

        Deliberately not gated on a live access token: the refresh token is itself the proof of ownership, and an
        expired access token must not leave a 14-day refresh token impossible to revoke.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      security:
      - {}
      responses:
        '205':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: v1_auth_me_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: v1_auth_me_partial_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/password-change/:
    post:
      operationId: v1_auth_password_change_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      description: |-
        Always answers 202 with the same body, whether or not the address belongs to an account (no enumeration).
        The e-mail is sent by a Celery task after commit, so response time does not reveal it either.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: v1_auth_verify_email_create
      description: (Re)send the verification e-mail for the signed-in user's current
        address.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/verify-email/confirm/:
    post:
      operationId: v1_auth_verify_email_confirm_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/bookings/:
    get:
      operationId: v1_bookings_list
      summary: 'My lessons (students: lessons I booked; tutors: my roster)'
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Lessons starting on/after this UTC date (YYYY-MM-DD) or ISO date-time.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -start_time_utc
          - start_time_utc
        description: 'Default: soonest first for when=upcoming, newest first otherwise.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
        description: 1-100 (default 20).
      - in: query
        name: status
        schema:
          type: string
        description: One or more booking statuses, comma-separated or repeated.
      - in: query
        name: to
        schema:
          type: string
        description: Lessons starting on/before this UTC date (whole day) or ISO date-time.
      - in: query
        name: when
        schema:
          type: string
          enum:
          - past
          - upcoming
        description: upcoming = not yet ended, excluding cancelled and lapsed unpaid
          holds; past = already ended.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingDetailList'
          description: ''
    post:
      operationId: v1_bookings_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreate'
          description: ''
  /api/v1/bookings/{booking_id}/cancel/:
    post:
      operationId: v1_bookings_cancel_create
      description: |-
        The student or the tutor cancels a lesson. Refunds, bonus credit and strikes follow the D-6 policy (see
        docs/CANCELLATION_AND_REFUNDS.md). A student cancelling inside the free window must send acknowledge_forfeit=true.
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
          description: ''
  /api/v1/bookings/{booking_id}/cancel-preview/:
    get:
      operationId: v1_bookings_cancel_preview_retrieve
      description: 'What would happen if I cancelled now? Read-only: shown before
        the student/tutor confirms.'
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelPreview'
          description: ''
  /api/v1/bookings/{booking_id}/host-link/:
    get:
      operationId: v1_bookings_host_link_retrieve
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostLink'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
          description: ''
  /api/v1/bookings/{booking_id}/memo/:
    post:
      operationId: v1_bookings_memo_create
      description: |-
        The lesson's own tutor submits (or later corrects) the post-lesson memo. Everything below succeeds or fails together:
        the validated memo, the booking's move to COMPLETED, and the student's flashcards.
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonMemoInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LessonMemoInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LessonMemoInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonMemo'
          description: ''
  /api/v1/bookings/{booking_id}/redeem-credit/:
    post:
      operationId: v1_bookings_redeem_credit_create
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/bookings/{booking_id}/report-outage/:
    post:
      operationId: v1_bookings_report_outage_create
      description: |-
        An Eskom load-shedding / grid outage around the lesson (D-6):
        1. The lesson's tutor or staff can report it; a student only when the provider confirms an active outage in the tutor's area
           (a student's own power or internet problem is a dispute, since it would refund them while the tutor goes unpaid).
        2. The booking becomes INTERRUPTED_POWER and a full gateway refund is queued (the student may convert it to wallet credit).
           The tutor is not paid and gets no strike.
        3. A lesson the tutor already taught for the minimum lesson time is a delivered lesson, not an outage.
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/bookings/{booking_id}/reschedule/:
    post:
      operationId: v1_bookings_reschedule_create
      description: |-
        The student moves a paid, still-future lesson to another open slot of the same tutor (once, more than 2 hours before it
