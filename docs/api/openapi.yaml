          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        new_password_confirm:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        uid:
          type: string
          minLength: 1
          maxLength: 128
        token:
          type: string
          minLength: 1
          maxLength: 256
