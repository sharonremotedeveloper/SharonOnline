components:
  schemas:
    AccentEnum:
      enum:
      - ZA
      - UK
      - US
      - OTHER
      type: string
      description: |-
        * `ZA` - South African
        * `UK` - British
        * `US` - American
        * `OTHER` - International
    AccountTypeEnum:
      enum:
      - cheque
      - savings
      type: string
      description: |-
        * `cheque` - cheque
        * `savings` - savings
    AdminCancelRequestRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
        booking_ids:
          type: array
          items:
            type: string
            format: uuid
          description: 'Default: every future pending / confirmed lesson of the tutor.'
          maxItems: 200
      required:
      - reason
    AdminCancelResult:
      type: object
      properties:
        teacher_id:
          type: string
          format: uuid
        cancelled_count:
          type: integer
        remaining:
          type: boolean
          description: 'The default list was capped (50 lessons per call): call again
            for the rest.'
        payment_in_flight_ids:
          type: array
          items:
            type: string
            format: uuid
          description: 'Unpaid holds whose payment may still complete: left untouched,
            retry once the payment has resolved.'
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminCancelRow'
      required:
      - cancelled_count
      - payment_in_flight_ids
      - remaining
      - results
      - teacher_id
    AdminCancelRow:
      type: object
      properties:
        booking_id:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
        status:
          type: string
      required:
      - booking_id
      - outcome
      - status
    AdminRefund:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        booking_id:
          type: string
          format: uuid
          readOnly: true
        student:
          type: string
          readOnly: true
          description: Display name only (never an e-mail address).
        amount:
          type: string
          readOnly: true
          description: Exact decimal string in `currency`.
        currency:
          type: string
          readOnly: true
        reason:
          allOf:
          - $ref: '#/components/schemas/RefundReasonEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/RefundStatusEnum'
          readOnly: true
        failure_kind:
          allOf:
          - $ref: '#/components/schemas/FailureKindEnum'
          readOnly: true
        failure_detail:
          type: string
          readOnly: true
          description: Stripped and truncated to 200 characters.
        attempts:
          type: integer
          readOnly: true
        next_attempt_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_http_status:
          type: integer
          readOnly: true
          nullable: true
        last_error_code:
          type: string
          readOnly: true
        gateway:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        age_hours:
          type: number
          format: double
          readOnly: true
        recent_attempts:
          type: array
          items:
            $ref: '#/components/schemas/AdminRefundAttempt'
          readOnly: true
      required:
      - age_hours
      - amount
      - attempts
      - booking_id
      - created_at
      - currency
      - failure_detail
      - failure_kind
      - gateway
      - id
      - last_error_code
      - last_http_status
      - next_attempt_at
      - reason
      - recent_attempts
      - status
      - student
    AdminRefundAttempt:
      type: object
      properties:
        seq:
          type: integer
        kind:
          type: string
        result_state:
          type: string
        http_status:
          type: integer
          nullable: true
        error_code:
          type: string
        created_at:
          type: string
          format: date-time
        actor:
          type: string
          nullable: true
          description: Username of the admin, or null for the system.
      required:
      - actor
      - created_at
      - error_code
      - http_status
      - kind
      - result_state
      - seq
    AdminRefundBuckets:
      type: object
      properties:
        status:
          type: object
          additionalProperties:
            type: integer
        failure_kind:
          type: object
          additionalProperties:
            type: integer
        in_flight:
          type: integer
        waiting_manual:
          type: integer
      required:
      - failure_kind
      - in_flight
      - status
      - waiting_manual
    AdminRefundError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
      - code
      - error
    AdminRefundPage:
      type: object
      properties:
        buckets:
          $ref: '#/components/schemas/AdminRefundBuckets'
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminRefund'
      required:
      - buckets
      - count
      - next
      - previous
      - results
    AdminRefundRetryRequest:
      type: object
      properties:
        confirm_not_refunded_in_gateway:
          type: boolean
          default: false
          description: 'Required for ambiguous failures (exhausted, replay_window,
            already_refunded): the admin has checked the gateway and the money did
            NOT go out.'
    AdminTeacherError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
      - code
      - error
    ApplicationOverview:
      type: object
      properties:
        status:
          type: string
        editable:
          type: boolean
        can_submit:
          type: boolean
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Step'
        requirements:
          $ref: '#/components/schemas/Requirements'
        submitted_at:
          type: string
          format: date-time
          nullable: true
      required:
      - can_submit
      - editable
      - requirements
      - status
      - steps
      - submitted_at
    AvailabilityChange:
      type: object
      properties:
        availability:
          $ref: '#/components/schemas/TeacherAvailability'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
      required:
      - availability
      - conflicts
    AvailabilityMatrixRequest:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityRowRequest'
        acknowledge_conflicts:
          type: boolean
          default: false
      required:
      - rows
    AvailabilityReplaceResult:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/TeacherAvailability'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
      required:
      - conflicts
      - rows
    AvailabilityRowRequest:
      type: object
      properties:
        day_of_week:
          type: integer
          maximum: 6
          minimum: 0
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        is_active:
          type: boolean
          default: true
      required:
      - day_of_week
      - end_time
      - start_time
    BankNameEnum:
      enum:
      - Capitec Bank
      - First National Bank (FNB)
      - Standard Bank
      - Nedbank
      - Absa Bank
      - Discovery Bank
      - TymeBank
      - Investec Bank
      type: string
      description: |-
        * `Capitec Bank` - Capitec Bank
        * `First National Bank (FNB)` - First National Bank (FNB)
        * `Standard Bank` - Standard Bank
        * `Nedbank` - Nedbank
        * `Absa Bank` - Absa Bank
        * `Discovery Bank` - Discovery Bank
        * `TymeBank` - TymeBank
        * `Investec Bank` - Investec Bank
    BookingCreate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        start_time_utc:
          type: string
          format: date-time
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
      required:
      - id
      - start_time_utc
      - status
    BookingCreateRequest:
      type: object
      properties:
        teacher_id:
          type: string
          format: uuid
          writeOnly: true
        material_id:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
        start_time_utc:
          type: string
          format: date-time
      required:
      - start_time_utc
      - teacher_id
    BookingDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        booking_reference:
          type: string
          readOnly: true
        teacher:
          allOf:
          - $ref: '#/components/schemas/TeacherList'
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/BookingStudent'
          readOnly: true
        material:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        material_slug:
          type: string
          nullable: true
          readOnly: true
        material_title:
          type: string
          nullable: true
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
          default: pending_payment
        start_time_utc:
          type: string
          format: date-time
          readOnly: true
        end_time_utc:
          type: string
          format: date-time
          readOnly: true
        local_date:
          type: string
          readOnly: true
        local_start_time:
          type: string
          readOnly: true
        local_end_time:
          type: string
          readOnly: true
        viewer_timezone:
          type: string
          readOnly: true
        price_usd:
          type: string
          readOnly: true
        price_zar:
          type: string
          readOnly: true
        lock_expires_at:
          type: string
          nullable: true
          readOnly: true
        student_rating:
          type: integer
          readOnly: true
          nullable: true
          description: 1 to 5 star rating
        student_review:
          type: string
        memo:
          allOf:
          - $ref: '#/components/schemas/LessonMemo'
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reschedule_count:
          type: integer
          readOnly: true
        original_start_time_utc:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Where the lesson started out, before its first reschedule
      required:
      - booking_reference
      - cancelled_at
      - created_at
      - end_time_utc
      - id
      - local_date
      - local_end_time
      - local_start_time
      - lock_expires_at
      - material
      - material_slug
      - material_title
      - memo
      - original_start_time_utc
      - price_usd
      - price_zar
      - reschedule_count
      - start_time_utc
      - status
      - student
      - student_rating
      - teacher
      - viewer_timezone
    BookingStatusEnum:
      enum:
      - pending_payment
      - confirmed
      - in_progress
      - completed
      - cancelled
      - disputed
      - interrupted_power
      - student_no_show
      - teacher_no_show
      - completed_pending_memo
      - completed_memo_forfeited
      - cancelled_by_student
      - student_late_cancelled
      - cancelled_by_teacher
      type: string
      description: |-
        * `pending_payment` - Pending Payment
