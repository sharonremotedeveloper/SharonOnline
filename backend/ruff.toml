# Ruff lint gate (Q0, docs/QUALITY_GATES.md). CI runs `ruff check .` from backend/ as a blocking job.
target-version = "py312"
extend-exclude = ["venv", "staticfiles", "media"]

[lint]
# F = pyflakes, B = bugbear, S = bandit security, C90 = mccabe complexity.
select = ["F", "B", "S", "C90"]

[lint.mccabe]
max-complexity = 12

# ---------------------------------------------------------------- policy (permanent, reviewed)
[lint.per-file-ignores]
# Tests: `assert` is the point, and fixture passwords / tokens are fake by construction.
"tests/**/*.py" = ["S101", "S105", "S106"]
# Django settings modules layer on each other with star imports by design.
"config/settings/local.py" = ["F403", "F405"]
"config/settings/production.py" = ["F403", "F405"]
# The mutation helper and its test drive git / pytest subprocesses with fixed argv lists (no shell).
"scripts/mutate.py" = ["S603", "S607"]
"tests/test_q0_mutate.py" = ["S603", "S607"]

# ---------------------------------------------------------------- BASELINE (2026-10-04): existing violations only
# Generated from `ruff check . --output-format json` (file -> rule codes it violated on the baseline date): 173 violations,
# 53 files, 69 (file, code) pairs. Rules: entries may only be REMOVED or narrowed (fix the code, delete the code from the list, run
# `ruff check .`); never add a file or a code here - new code must be clean. tests/guards/test_guard_ruff_baseline.py
# fails when an entry no longer matches any violation, so the list cannot go stale.
