[pytest]
DJANGO_SETTINGS_MODULE = config.settings.local
python_files = tests.py test_*.py *_tests.py
markers =
    redis: requires REDIS_TEST_URL and exercises the real Redis backend
    postgres: requires PostgreSQL and exercises database-specific financial invariants
    allow_network: opt out of the autouse no-network guard (tests/network_guard.py); real sockets are allowed
