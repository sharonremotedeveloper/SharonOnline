services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: esl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: esl_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d esl_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis 7 (Pessimistic Locks & Celery Broker)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: esl_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Django REST API Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esl_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_data &&
             python manage.py seed_phase41_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DJANGO_DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/esl_dev
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=django-insecure-dev-key-change-in-production-esl-marketplace-2026
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Celery Asynchronous Task Worker
  # ----------------------------------------------------------------------------
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esl_celery
    restart: unless-stopped
    command: celery -A config worker -l info -c 2 -Q celery,scheduler_beat,financial_escrow,notifications,critical_io
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/esl_dev
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=django-insecure-dev-key-change-in-production-esl-marketplace-2026
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Celery Beat Periodic Task Scheduler
  # ----------------------------------------------------------------------------
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esl_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/esl_dev
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=django-insecure-dev-key-change-in-production-esl-marketplace-2026
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Next.js 14 Frontend Application
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: esl_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - INTERNAL_API_URL=http://backend:8000/api/v1
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NODE_ENV=development
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
