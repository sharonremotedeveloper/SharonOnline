name: Quality gates

# Every job here is a required check for merging into develop / main (branch protection is configured in GitHub, not in this file).
on:
  pull_request:
  push:
    branches: [main, develop, remediation/tech-debt]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Q0 (docs/QUALITY_GATES.md): ruff F/B/S/C90 with a shrink-only per-file baseline in backend/ruff.toml. Blocking.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the pinned ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"
        working-directory: backend
      - run: ruff check . --output-format github
        working-directory: backend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python manage.py check
        working-directory: backend
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      # Django's production security checks against the real production settings module (throwaway values; see the script).
      - name: Deploy checks (production settings)
        run: python scripts/check_deploy.py
        working-directory: backend
      # Coverage is reported, not enforced yet (no --cov-fail-under; plan §5 diff-coverage thresholds are a follow-up).
      # --durations=15 lists the slowest tests (plan §5: no new test over 2 s). The guard tests (tests/guards/) and the
      # stale-OpenAPI check (tests/test_api_contract.py::...::test_committed_schema_is_current) run as part of this suite.
      - run: >-
          python -m pytest -q -m "not redis and not postgres"
          --cov=apps --cov=config --cov-report=term:skip-covered --durations=15
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run check:api-types
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          INTERNAL_API_URL: http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  # Known-vulnerable dependencies. Python is blocking. The frontend report is informational until Task 8.9 (Next.js 14 -> 15/16):
  # the open advisories are in Next itself and are only fixed by that major upgrade. Remove `continue-on-error` when 8.9 lands.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: pip-audit (blocking)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  postgres-ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sharon_test
          POSTGRES_PASSWORD: sharon_test
          POSTGRES_DB: sharon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sharon_test -d sharon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sharon_test:sharon_test@127.0.0.1:5432/sharon_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      # Every migration (including the data migrations) must apply from zero on the real database engine.
      - name: Migrate a fresh PostgreSQL database
        run: python manage.py migrate --noinput
        working-directory: backend
      - run: python -m pytest -q -m postgres
        working-directory: backend

  redis-races:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python -m pytest -q -m redis
        working-directory: backend
